name: blink_client
description: BLINK local-first five-platform desktop and mobile client.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  blink_core:
    path: ../../packages/blink_core
  blink_sanitizer:
    path: ../../packages/blink_sanitizer
  ffi: 2.2.0
  flutter:
    sdk: flutter
  material_ui: 1.11.0
  tray_manager: 0.9.0
  win32: 6.4.0
  window_manager: 0.7.0

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
