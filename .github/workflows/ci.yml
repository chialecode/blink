name: CI

# Keep this job name in sync with the main-protection ruleset. No path filters:
# every PR must produce the required check, including documentation-only PRs.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: repository-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install native build packages for desktop plugins
        # The tray/window plugin compiles native code in its build hook and
        # needs the GTK 3, X11 and Xi headers on Linux.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends pkg-config libgtk-3-dev libx11-dev libxi-dev

      - name: Download and verify pinned Flutter SDK
        run: |
          python -B scripts/check.py --install-linux-flutter "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/flutter/bin" >> "${GITHUB_PATH}"

      - name: Configure Flutter and fetch dependencies
        run: |
          flutter --suppress-analytics --disable-analytics
          flutter --suppress-analytics config --no-cli-animations
          flutter --suppress-analytics --version
          (cd apps/blink_client && flutter --suppress-analytics pub get)

      - name: Run repository quality gate
        run: python -B scripts/check.py --ci
